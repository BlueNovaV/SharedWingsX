name: Deploy SharedWingsX relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cloud/**

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloud
          command: deploy
